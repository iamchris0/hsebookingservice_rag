# Кто может подключаться к PostgreSQL. Всё, что не перечислено, — отклоняется.

# Внутри контейнера (init-скрипты, psql через docker compose exec)
local   all     all                         trust
host    all     all     127.0.0.1/32        trust

# Сеть Docker: backend, backup и DBeaver через SSH-туннель (приходит через docker-proxy)
host    all     all     172.16.0.0/12       scram-sha-256

# Yandex DataLens: только роль viewer, только по TLS, только с их адресов
# (актуальный список: yandex.cloud/ru/docs/datalens/operations/connection/create-postgresql)
hostssl all     viewer  178.154.242.128/28  scram-sha-256
hostssl all     viewer  178.154.242.144/28  scram-sha-256
hostssl all     viewer  178.154.242.160/28  scram-sha-256
hostssl all     viewer  178.154.242.176/28  scram-sha-256
hostssl all     viewer  178.154.242.192/28  scram-sha-256
hostssl all     viewer  178.154.242.208/28  scram-sha-256
hostssl all     viewer  130.193.60.0/28     scram-sha-256
