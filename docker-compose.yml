services:
  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_BACKEND_URL: "http://158.160.18.43:3001"
    ports:
      - "2000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    depends_on:
      - backend
